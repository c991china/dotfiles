# ~/.tmux.conf -- no plugin manager required.
# Reload with: tmux source-file ~/.tmux.conf   (or prefix + r, bound below)

# ---- prefix ------------------------------------------------------------
# C-b is too far from home row. C-a clashes with bash's beginning-of-line, but
# pressing it twice sends C-a through, which I got used to.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- general -----------------------------------------------------------
set -g base-index 1            # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on     # no gaps when you close a window
set -g history-limit 50000
set -g mouse on                # scroll panes, resize, select windows by click
set -g escape-time 10          # default 500ms makes vim feel laggy in tmux
set -g focus-events on         # vim/nvim get FocusGained events

# ---- terminal ----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # truecolor
set -g allow-passthrough on

# ---- splitting ---------------------------------------------------------
# | and - split, and the new pane opens in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- navigation (vi keys) ---------------------------------------------
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes with repeatable HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- copy mode (vi) ----------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat"

# ---- quality of life ---------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# new window/session open in the current path
bind c new-window -c "#{pane_current_path}"

# ---- status bar --------------------------------------------------------
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[fg=colour250]| "
set -g status-right "#[fg=colour250]| %H:%M #[fg=colour39,bold]#h "
setw -g window-status-current-style "bg=colour39,fg=colour236,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
